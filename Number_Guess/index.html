<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess the Number</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Guess The Number</h1>
    <p class="subtitle">I'm thinking of a number between 1 to 100...</p>

    <p id="message" class="message"></p>
    <div class="input-row">
      <input type="number" id="guess-input" min="1" max="100" placeholder="your guess">
      <button id="guess-btn">Guess</button>
    </div>

    <p class="info">Tries Left : <span id="tries-left">7</span></p>
    <p class="info">Your guesses: <span id="history"></span></p>
    <p class="mod-info"><span id="mod-val"></span></p>
    <button id="restart-btn" class="hidden">Play again!!</button>
    <button id="mod" class="mod">Mod(Binary search)</button>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
