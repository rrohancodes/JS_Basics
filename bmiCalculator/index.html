<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>BMI Calculator</h1>
  <form id="bmiForm">
    <label for="age">Age: </label>
    <input type="number" id="age" name="age" placeholder="age" min="1" required>
    <p>Gender</p>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <br>

    <label for="height">Height (cm): </label>
    <input type="number" id="height" name="height" placeholder="height" min="1" required>
    <br>

    <label for="weight">Weight (kg): </label>
    <input type="number" id="weight" name="weight" placeholder="weight" min="1" required>
    <br>

    <button type="submit">Calculate</button>
  </form>

  <p id="result"></p>
  <script src="script.js"></script>
</body>
</html>
